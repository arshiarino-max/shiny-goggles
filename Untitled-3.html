<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برای تو 💙</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Tahoma, Arial, sans-serif;

            background:
                radial-gradient(circle at top, #173f72, #07111f 55%, #02050a);

            color: white;

            overflow: hidden;
        }


        .container {
            width: 90%;
            max-width: 650px;

            text-align: center;

            padding: 40px 25px;
        }


        .title {
            font-size: 28px;
            margin-bottom: 15px;

            animation: fadeIn 1.5s ease;
        }


        .subtitle {
            font-size: 17px;
            color: #b9cbe3;

            margin-bottom: 35px;

            animation: fadeIn 2s ease;
        }


        /* دکمه اصلی */

        #startButton {

            border: none;

            padding: 17px 38px;

            border-radius: 50px;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            color: white;

            background: linear-gradient(
                135deg,
                #168cff,
                #0055c9
            );

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(0, 110, 255, 0.35);

            transition: 0.3s;
        }


        #startButton:hover {
            transform: scale(1.07);

            box-shadow:
                0 15px 40px rgba(0, 140, 255, 0.5);
        }


        /* پیام */

        #message {

            display: none;

            margin-top: 35px;

            animation: messageAppear 1s ease;
        }


        .message-text {

            font-size: 27px;

            line-height: 2;

            font-weight: bold;

            text-shadow:
                0 0 20px rgba(60, 160, 255, 0.35);
        }


        .message-text span {
            color: #5bb5ff;
        }


        /* قلب */

        #heart {

            display: none;

            margin: 35px auto 0;

            font-size: 80px;

            cursor: pointer;

            user-select: none;

            width: fit-content;

            transition:
                transform 0.3s ease;

            filter:
                drop-shadow(
                    0 0 15px rgba(0, 140, 255, 0.6)
                );

            animation: heartAppear 1s ease;
        }


        #heart:hover {
            transform: scale(1.12);
        }


        .hint {

            display: none;

            margin-top: 20px;

            color: #91a9c4;

            font-size: 14px;

            animation: fadeIn 1s ease;
        }


        /* انیمیشن‌ها */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        @keyframes heartAppear {

            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* قلب‌های پس‌زمینه */

        .background-heart {

            position: fixed;

            bottom: -50px;

            opacity: 0.15;

            font-size: 25px;

            pointer-events: none;

            animation: floatUp 8s linear infinite;
        }


        .h1 {
            left: 10%;
            animation-delay: 1s;
        }

        .h2 {
            left: 30%;
            animation-delay: 4s;
        }

        .h3 {
            left: 70%;
            animation-delay: 2s;
        }

        .h4 {
            left: 90%;
            animation-delay: 5s;
        }


        @keyframes floatUp {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            to {
                transform:
                    translateY(-120vh)
                    rotate(360deg);
            }

        }


        /* موبایل */

        @media (max-width: 600px) {

            .title {
                font-size: 24px;
            }

            .message-text {
                font-size: 22px;
            }

            #heart {
                font-size: 75px;
            }

        }

    </style>

</head>


<body>


    <!-- قلب‌های پس‌زمینه -->

    <div class="background-heart h1">💙</div>
    <div class="background-heart h2">💙</div>
    <div class="background-heart h3">💙</div>
    <div class="background-heart h4">💙</div>


    <div class="container">


        <div class="title">
            یه چیزی می‌خوام بهت بگم...
        </div>


        <div class="subtitle">
            فقط این دکمه رو بزن 💙
        </div>


        <button id="startButton" onclick="showMessage()">
            اینجا رو بزن
        </button>


        <!-- پیام مخفی -->

        <div id="message">

            <div class="message-text">

                می‌دونم خسته‌ای و تلاش می‌کنی...
                <br>

                <span>
                    من کنارتم 💙
                </span>

            </div>


            <div id="heart" onclick="growHeart()">
                💙
            </div>


            <div class="hint" id="hint">
                دوباره قلب رو لمس کن...
            </div>

        </div>

    </div>


    <script>

        let heartSize = 80;


        function showMessage() {

            document.getElementById("startButton").style.display = "none";

            document.querySelector(".subtitle").style.display = "none";

            document.getElementById("message").style.display = "block";

            document.getElementById("heart").style.display = "block";

            document.getElementById("hint").style.display = "block";

        }


        function growHeart() {

            heartSize += 25;

            document.getElementById("heart").style.fontSize =
                heartSize + "px";


            /* وقتی خیلی بزرگ شد دوباره کوچیکش نمی‌کنیم؛
               هر کلیک بزرگ‌تر میشه */

            if (heartSize >= 250) {

                document.getElementById("hint").innerText =
                    "هرچقدر هم بزرگ بشه، باز اندازه‌ی حسی که بهت دارم نیست 💙";

            }

        }

    </script>


</body>

</html>
